[BridgeServer]
# bridge 只给 VPS 本机 GitHub runner 访问；生产环境不建议直接公网暴露
host="127.0.0.1"
port="14547"
# 为空表示不限制 repo；生产环境建议设置为期望的仓库名
repo=""

[SlaveServer]
# bridge.py 转发任务时访问本机 slave
host="127.0.0.1"
# slave 需要被内网 master 访问，因此监听 0.0.0.0；请用云安全组限制来源 IP
bind_host="0.0.0.0"
port="14548"
db_path="/data/mlu_ci/sglang_tasks.json"
log_dir="/data/mlu_ci/logs"

# Runtime task GC policy.
terminal_retention_seconds="86400"
active_task_timeout_seconds="172800"
